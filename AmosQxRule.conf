#本地分流规则(对于完全相同的某条规则，本地的将优先生效，相同规则优先级从上到下)
// 完整域名匹配
;host, www.google.com, proxy
// 域名后缀匹配
;host-suffix, googleapis.com, proxy
// 域名关键词匹配
;host-keyword, adsite, reject
// 域名通配符匹配
;host-wildcard, *abc.com, proxy

[filter_local]
# ── 优先级提示 ──────────────────────────────────────────────
# QX 规则优先级: filter_local > filter_remote(自上而下, 先匹配先生效)。
# 因此下面每一条都会抢在 [filter_remote] 全部订阅之前生效。
# 特别注意 geoip,cn,direct —— 任何解析到中国 IP 的域名一律直连，
# 这会覆盖远程订阅里对该域名的策略指定（例如国内中转站即使写进
# llm_qx 的代理组，也会被这里抢成直连）。保留它是有意为之：
# 国内 IP 直连最快，且 ChinaASN.list 已提供国内网段的直连覆盖。
# ────────────────────────────────────────────────────────────
host-suffix, owner-api.teslamotors.com, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
ip-cidr, 182.254.116.0/24, direct
geoip, cn, direct
final, direct

