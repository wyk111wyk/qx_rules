# - Amos QuantumultX CONFIG - #

[general]
# > 用于节点延迟测试
server_check_url=http://www.gstatic.com/generate_204
# > 节点延迟测试超时参数，需小于 5000 毫秒才生效 (毫秒)
server_check_timeout = 3000
# > 用于Check节点IP地址
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/Scripts/IP_API.js
# > 功能强大的解析器，用于引用资源的转换
resource_parser_url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/Scripts/resource-parser.js
# > 下列路径将不经过QuanX的处理
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
udp_whitelist=1-442, 444-65535
# > dns_exclusion_list 银行流量不走代理
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, *.10099.com.cn, id6.me, *.bankcomm.com, *.icbc.com.cn, *.bankofamerica.com

# 策略组[policy]
# https://www.notion.so/kopshawn/f79170e2629d42b79b88f53283c94147
# static 策略组中，你需要手动选择想要的节点/策略组。
# available 策略组将按顺序选择你列表中第一个可用的节点。
# round-robin 策略组，将按列表的顺序轮流使用其中的节点。
# url-latency-benchmark 延迟策略组，选取延迟最优节点。
# dest-hash 策略组，随机负载均衡，但相同域名走固定节点。
# ssid 策略组，将根据你所设定的网络来自动切换节点/策略组
# ICON下载：https://github.com/Orz-3/mini/tree/master/Color

[policy]

# > 自定义可选路线
static=苹果服务, direct, 最佳节点, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/Apple.png

static=国内流媒体, direct, 香港节点, 台湾节点, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/bilibili.png

static=国内LLM, direct, 香港节点, 台湾节点, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/deepseek.png

static=境外LLM, 美国节点, 日本节点, 新加坡节点, 香港节点, proxy, direct, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/OpenAI.png

#默认设置15分钟测速一次，可自行修改check-interval=后面的数值（单位：秒），tolerance=后面的数值不建议修改
#将下面的url-latency-benchmark的内容替换成static，并删除[check-interval=21600, tolerance=0, ]即可手动选择节点

# > 默认预置路线
url-latency-benchmark=最佳节点, server-tag-regex=^(.)*$, check-interval=21600, tolerance=0, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/Auto.png

url-latency-benchmark=香港节点, server-tag-regex=(?=.*(香港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval=21600, tolerance=0, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/HK.png

url-latency-benchmark=日本节点, server-tag-regex=(?=.*(日本|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval=21600, tolerance=0, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/JP.png

url-latency-benchmark=新加坡节点, server-tag-regex=(?=.*(新加坡|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval=21600, tolerance=0, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/SG.png

url-latency-benchmark=美国节点, server-tag-regex=(?=.*(美国|US|(?i)States|American))^((?!(港|台|日|韩|新)).)*$, check-interval=21600, tolerance=0, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/US.png

available=俄罗斯节点, server-tag-regex=(?=.*(俄罗斯|Russia))^((?!(港|台|日|韩|新|美)).)*$, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/RU.png

# 修正: 原正则写的是「台湾1」，导致「台湾 01」「台湾台北」等常见标签全部漏匹配，
#       只有恰好写作「台湾1…」的标签才进得来。已改回「台湾」，与其余各组写法一致。
available=台湾节点, server-tag-regex=(?=.*(台湾|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, img-url=https://raw.githubusercontent.com/wyk111wyk/qx_rules/master/IconSet/TW.png

#规则分流远程订阅
#远程分流模块，可使用force-policy来强制使用策略偏好, 替换远程规则内所指定的策略组
# update-interval 为更新时间参数，单位 秒, 默认更新时间为 24*60*60=86400 秒，也就是24小时.
# opt-parser=true/false 用于控制是否对本订阅 开启资源解析器，不写或者 false 表示不启用解析器;

[filter_remote]
# > 广告拦截 分流（合并精简版：广告终结 + 隐私保护 + 运营劫持 + 规则修正）
#   说明: 单文件已内置策略 —— 顶部「规则修正」direct 放行，其后 reject 拦截。
#   故此处不使用 force-policy，让列表内自带策略生效（QX 先匹配先生效 → 白名单优先）。
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/AdRules/AdBlock.list, tag=广告拦截, update-interval=86400, opt-parser=true, enabled=true

# > LLM 分流
#   位置说明（关键）：QX 远程订阅「先本地后远程、远程自上而下、先匹配先生效」。
#   这两条必须排在「全球加速（Global.list，3.5 万条大杂烩）」之前 ——
#   否则 Global.list 里的 chatgpt.com / claude.ai / grok.com / cursor.com /
#   openrouter.ai 等 51 条重名规则会抢先命中，这些域名将被错误地送进
#   「最佳节点」而不是「境外LLM」策略组，导致策略组手动选点失效。
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/llm_qx.list, tag=LLM_AI, force-policy=境外LLM, update-interval=7776000, opt-parser=true, enabled=true

# > LLM_China 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/llm_china.list, tag=LLM_China, force-policy=国内LLM, update-interval=7776000, opt-parser=true, enabled=true

# > 苹果涉外服务 分流（Apple News / Apple TV / TestFlight / iCloud 隐私中继等必须走代理的服务）
#   位置说明（关键）：必须排在 Apple.list 之前。Apple.list 内含 HOST-SUFFIX,apple.com、
#   icloud.com 等宽后缀规则，若让 Apple.list 先命中，本订阅 39 条域名规则会被 100% 抢走
#   → Apple News / TV / TestFlight / mask.icloud.com 全部走「苹果服务」组（默认 direct）而打不开。
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/AppleProxy.list, tag=苹果涉外服务, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

# > Apple 分流
#   位置说明（关键）：必须排在「全球加速（Global.list）」之前。两者重叠 1479 条，
#   若让 Global.list 先命中，这些苹果域名会走「最佳节点」而不是你配置的「苹果服务」
#   策略组，导致 App Store / iCloud 备份等本可直连的服务全部绕代理。
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/Apple.list, tag=苹果服务, force-policy=苹果服务, update-interval=7776000, opt-parser=true, enabled=true

# > GitHub SPM 分流（Xcode 下载 Swift Package 用，统一走可配置的「最佳节点」自动测速组）
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/GitHubSPM.list, tag=GitHubSPM, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

# > Steam 分流（统一走可配置的「最佳节点」自动测速组）
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/Steam.list, tag=Steam, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/SteamCN.list, tag=SteamCN, force-policy=direct, update-interval=7776000, opt-parser=true, enabled=true

# > 机场专线 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/airports.list, tag=机场专线, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

# > 网络测速 分流
#   策略修正: 原为 force-policy=direct。但本列表内全是境外测速服务器
#   （ooklaserver.net / fast.com / speed.cloudflare.com），直连要么连不上、
#   要么测的是裸带宽而非节点速度。改为走「最佳节点」。
#   另: 该订阅以前还会把 GlobalMedia / Global 里的 fast.com 抢成直连，改策略后一并解决。
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/Speedtest.list, tag=网络测速, force-policy=最佳节点, update-interval=7776000, opt-parser=false, enabled=true

# > 国内社媒 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/WeChat.list, tag=微信, force-policy=direct, update-interval=7776000, opt-parser=false, enabled=true

# > 国内流媒体 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/Bilibili.list, tag=哔哩哔哩, force-policy=国内流媒体, update-interval=7776000, opt-parser=true, enabled=true

https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/NeteaseMusic.list, tag=网易云音乐, force-policy=国内流媒体, update-interval=7776000, opt-parser=true, enabled=true

https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/ChinaMedia.list, tag=国内流媒体, force-policy=国内流媒体, update-interval=7776000, opt-parser=true, enabled=true

# > 国内网站ChinaASN 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/ChinaASN.list, tag=国内网站, force-policy=direct, update-interval=7776000, opt-parser=true, enabled=true

# > 外国社媒 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/GlobalSocial.list, tag=外国社媒, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

# > 外国流媒体 分流
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/GlobalMedia.list, tag=外国流媒体, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

# > 全球加速 分流（国外域名大合集，兜底走代理 —— 务必排在各类特定服务订阅之后）
https://raw.githubusercontent.com/wyk111wyk/qx_rules/refs/heads/main/Policy/Global.list, tag=全球加速, force-policy=最佳节点, update-interval=7776000, opt-parser=true, enabled=true

